name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  supply-chain-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build

      - name: Generate SBOM
        run: ./bin/warden sbom generate --go-mod go.mod --go-sum go.sum --name warden -o sbom.json

      - name: Determine cache key date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache KEV catalog
        uses: actions/cache@v5
        with:
          path: ~/.cache/warden/kev.json
          key: kev-catalog-${{ steps.date.outputs.date }}
          restore-keys: |
            kev-catalog-

      - name: Scan for known vulnerabilities (report)
        continue-on-error: true
        run: ./bin/warden scan --sbom sbom.json -o scan-results.json

      - name: Check licenses (report)
        continue-on-error: true
        run: ./bin/warden licenses check --sbom sbom.json -o license-report.json

      - name: Sign provenance attestation
        continue-on-error: true
        run: ./bin/warden attest sign --artifact bin/warden --artifact-name warden

      - name: Verify provenance attestation (sanity check)
        continue-on-error: true
        run: |
          ./bin/warden attest verify \
            --attestation bin/warden.intoto.jsonl \
            --pubkey bin/warden.intoto.jsonl.pub \
            --artifact bin/warden \
            --expect-repository https://github.com/${{ github.repository }} \
            --expect-ref ${{ github.ref }}

      - name: Enforce supply-chain policy
        # This is the real gate, so there is no continue-on-error. Pull
        # requests use a policy without the branch-ref pin, because their
        # OIDC ref claim is refs/pull/<n>/merge rather than refs/heads/main.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          POLICY=warden-policy.yaml
          if [ "$EVENT_NAME" = "pull_request" ]; then
            POLICY=warden-policy-pr.yaml
          fi
          ./bin/warden policy check \
            --sbom sbom.json \
            --policy "$POLICY" \
            --attestation bin/warden.intoto.jsonl \
            --pubkey bin/warden.intoto.jsonl.pub \
            --artifact bin/warden \
            -o policy-result.json

      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-reports
          path: |
            sbom.json
            scan-results.json
            license-report.json
            bin/warden.intoto.jsonl
            bin/warden.intoto.jsonl.pub
            policy-result.json
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: make docker-build VERSION=ci-test

      - name: Smoke test image
        run: |
          set -euo pipefail

          # The version injected via -ldflags must reach the binary.
          test "$(docker run --rm warden:dev --version)" = "warden version ci-test"

          # The image must run as the unprivileged user, never root.
          test "$(docker image inspect warden:dev --format '{{.Config.User}}')" = "65532:65532"

          # The image must work under a hardened runtime: read-only root
          # filesystem, no network, project mounted read-only.
          docker run --rm --read-only --network none \
            -v "$PWD":/work:ro -w /work warden:dev \
            sbom generate --go-mod go.mod --go-sum go.sum --name warden \
            > "$RUNNER_TEMP/sbom.json"
          grep -q '"bomFormat": "CycloneDX"' "$RUNNER_TEMP/sbom.json"

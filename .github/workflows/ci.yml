name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13
      - name: Check actions and base images are pinned
        run: bash scripts/check-pins.sh

  supply-chain-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make build

      - name: Generate SBOM
        run: ./bin/warden sbom generate --go-mod go.mod --go-sum go.sum --name warden -o sbom.json

      - name: Determine cache key date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache KEV catalog
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/warden/kev.json
          key: kev-catalog-${{ steps.date.outputs.date }}
          restore-keys: |
            kev-catalog-

      - name: Scan for known vulnerabilities (report)
        continue-on-error: true
        run: ./bin/warden scan --sbom sbom.json -o scan-results.json

      - name: Check licenses (report)
        continue-on-error: true
        run: ./bin/warden licenses check --sbom sbom.json -o license-report.json

      - name: Sign provenance attestation
        continue-on-error: true
        run: ./bin/warden attest sign --artifact bin/warden --artifact-name warden

      - name: Verify provenance attestation (sanity check)
        continue-on-error: true
        run: |
          ./bin/warden attest verify \
            --attestation bin/warden.intoto.jsonl \
            --pubkey bin/warden.intoto.jsonl.pub \
            --artifact bin/warden \
            --expect-repository https://github.com/${{ github.repository }} \
            --expect-ref ${{ github.ref }}

      - name: Enforce supply-chain policy
        # This is the real gate, so there is no continue-on-error. Pull
        # requests use a policy without the branch-ref pin, because their
        # OIDC ref claim is refs/pull/<n>/merge rather than refs/heads/main.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          POLICY=warden-policy.yaml
          if [ "$EVENT_NAME" = "pull_request" ]; then
            POLICY=warden-policy-pr.yaml
          fi
          ./bin/warden policy check \
            --sbom sbom.json \
            --policy "$POLICY" \
            --attestation bin/warden.intoto.jsonl \
            --pubkey bin/warden.intoto.jsonl.pub \
            --artifact bin/warden \
            -o policy-result.json

      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: supply-chain-reports
          path: |
            sbom.json
            scan-results.json
            license-report.json
            bin/warden.intoto.jsonl
            bin/warden.intoto.jsonl.pub
            policy-result.json
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build image
        run: make docker-build VERSION=ci-test

      - name: Smoke test image
        run: |
          set -euo pipefail

          # The version injected via -ldflags must reach the binary.
          test "$(docker run --rm warden:dev --version)" = "warden version ci-test"

          # The image must run as the unprivileged user, never root.
          test "$(docker image inspect warden:dev --format '{{.Config.User}}')" = "65532:65532"

          # The image must work under a hardened runtime: read-only root
          # filesystem, no network, project mounted read-only.
          docker run --rm --read-only --network none \
            -v "$PWD":/work:ro -w /work warden:dev \
            sbom generate --go-mod go.mod --go-sum go.sum --name warden \
            > "$RUNNER_TEMP/sbom.json"
          grep -q '"bomFormat": "CycloneDX"' "$RUNNER_TEMP/sbom.json"

  action-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Gate that should pass
        id: ok
        uses: ./
        with:
          version: v0.1.0-rc.1
          policy: .github/action-test-policy.yaml
          go-mod: go.mod
          go-sum: go.sum
          output-dir: ${{ runner.temp }}/gate-ok

      - name: Check the passing run's outputs
        env:
          RESULT: ${{ steps.ok.outputs.result-path }}
        run: |
          set -euo pipefail
          grep -q '"passed": true' "$RESULT"

      - name: Gate that must block
        id: deny
        continue-on-error: true
        uses: ./
        with:
          version: v0.1.0-rc.1
          policy: .github/action-test-policy-deny.yaml
          go-mod: go.mod
          go-sum: go.sum
          output-dir: ${{ runner.temp }}/gate-deny

      - name: Check the blocking run really failed on the policy
        env:
          OUTCOME: ${{ steps.deny.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          # Failing for the right reason: the policy result exists and says so.
          grep -q '"passed": false' "$RUNNER_TEMP/gate-deny/policy-result.json"

      - name: A floating version must be refused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out="$(VERSION=latest bash scripts/install-warden.sh 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "exact release tag" <<<"$out"
